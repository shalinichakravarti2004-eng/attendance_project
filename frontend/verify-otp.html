<!DOCTYPE html>
<html>
<head>
<title>OTP Verification</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
<div class="card p-4 shadow" style="width:350px">

<h4 class="text-center">Verify OTP</h4>

<input type="text" id="otp" class="form-control mt-3" placeholder="Enter OTP">

<button type="button" class="btn btn-success w-100 mt-3" onclick="verifyOTP()">
Verify
</button>

<button class="btn btn-warning w-100 mt-2" onclick="resendOTP()">
Resend OTP
</button>

<p id="msg" class="text-danger text-center mt-3"></p>
<p id="timer" class="text-primary text-center mt-2"></p>

</div>
</div>

<script src="js/verify.js"></script>
</body>
</html>
