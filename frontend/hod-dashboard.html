<!DOCTYPE html>
<html>
<head>
    <title>HOD Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        .header {
            background: #6a5acd;
            color: white;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .logout {
            position: absolute;
            right: 20px;
            top: 15px;
            background: red;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #6a5acd;
            color: white;
        }

        input {
            padding: 8px;
            width: 250px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 5px 10px;
            background: #6a5acd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>HOD Dashboard</h2>
    <p id="deptText"></p>
    <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

    <div class="card">
        <h3>Search Student</h3>
        <input type="text" id="search" placeholder="Search by name..." onkeyup="searchTable()">
    </div>

<div class="card">
    <h3>Mark OD (On Duty)</h3>

    <input type="text" id="odEnrollment" placeholder="Enrollment ID"><br><br>

    <label>From:</label><br>
    <input type="date" id="odFrom"><br><br>

    <label>To:</label><br>
    <input type="date" id="odTo"><br><br>

    <input type="text" id="odReason" placeholder="Reason (NCC/NSS/Event)"><br><br>

    <button class="btn" onclick="markOD()">Mark OD</button>

    <p id="odMsg"></p>
</div>

<div class="card">
    <h3>Cancel / Update OD</h3>

    <input type="text" id="cancelEnrollment" placeholder="Enrollment ID"><br><br>

    <label>Select Date:</label><br>
    <input type="date" id="cancelDate"><br><br>

    <label>Action:</label><br>
    <select id="cancelStatus">
        <option value="cancel">Cancel OD</option>
        <option value="Present">Mark Present</option>
        <option value="Absent">Mark Absent</option>
    </select><br><br>

    <button class="btn" onclick="updateAttendance()">Submit</button>

    <p id="cancelMsg"></p>
</div>

    <div class="card">
        <h3>Student List</h3>

        <table id="studentTable">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Branch</th>
                <th>Attendance %</th>
                <th>Action</th>
            </tr>
        </table>

    </div>

</div>

<script src="js/hod.js"></script>

</body>
</html>
