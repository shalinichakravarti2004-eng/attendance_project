<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f9;}
.topbar{
    background:#0d6efd;
    color:white;
    padding:12px 20px;
}
.stat-card{
    border:none;
    border-radius:12px;
    color:white;
}
.soft-card{
    border-radius:14px;
    border:none;
    transition:.2s;
}
.soft-card:hover{transform:translateY(-3px); box-shadow:0 6px 16px rgba(0,0,0,0.08);}
</style>
</head>

<body>

<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="m-0">🎓 Smart Attendance System</h5>
    <div>
        Admin: <b>Ajay</b>
        <button class="btn btn-light btn-sm ms-3" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container mt-4">

<!-- STATS -->
<div class="row g-3 mb-4">
<div class="col-md-3"><div class="card stat-card bg-success p-3"><h6>Total Students</h6><h3 id="totalStudents">0</h3></div></div>
<div class="col-md-3"><div class="card stat-card bg-warning p-3"><h6>Today Present</h6><h3 id="todayPresent">0</h3></div></div>
<div class="col-md-3"><div class="card stat-card bg-danger p-3"><h6>Today Absent</h6><h3 id="todayAbsent">0</h3></div></div>
<div class="col-md-3"><div class="card stat-card bg-primary p-3"><h6>Departments</h6><h3 id="deptCount">0</h3></div></div>
</div>

<!-- DATA -->
<div class="row">

<!-- ================= LEFT SIDE ================= -->
<div class="col-md-8">
<div class="card p-3 shadow-sm">
<h5>Students</h5>

<!-- 🔍 SEARCH -->
<input type="text" id="searchInput" class="form-control mb-2"
placeholder="Search by Name or Enrollment"
onkeyup="applyFilters()">

<!-- 🎯 DEPARTMENT FILTER -->
<select id="departmentFilter" class="form-control mb-2" onchange="loadBranchFilter(this.value)">
    <option value="">Select Department</option>
    <option>B.Tech</option>
    <option>M.Tech</option>
    <option>BCA</option>
    <option>MCA</option>
    <option>MBA</option>
</select>

<!-- 🌿 BRANCH FILTER -->
<select id="branchFilter" class="form-control mb-2" onchange="applyFilters()">
    <option value="">Select Branch</option>
</select>

<table class="table table-bordered">
<thead>
<tr>
<th>Enrollment</th>
<th>Name</th>
<th>Department</th>
<th>Branch</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="studentTable"></tbody>
</table>

</div>
</div>

<!-- ================= RIGHT SIDE ================= -->
<div class="col-md-4">
<div class="card p-3 shadow-sm">
<h5>Add Student</h5>

<input id="enrollment" class="form-control mb-2" placeholder="Enrollment">
<input id="name" class="form-control mb-2" placeholder="Name">

<select id="gender" class="form-control mb-2">
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<!-- ✅ DEPARTMENT -->
<select id="departmentInput" class="form-control mb-2" onchange="loadBranches(this.value)">
<option value="">Select Department</option>
<option>B.Tech</option>
<option>M.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>MBA</option>
</select>

<!-- ✅ BRANCH -->
<select id="branch" class="form-control mb-2">
<option value="">Select Branch</option>
</select>

<input id="email" class="form-control mb-2" placeholder="Email">
<input id="mobile" class="form-control mb-2" placeholder="Mobile">
<input id="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-success w-100" onclick="addStudent()">Add Student</button>
<p id="msg"></p>

</div>
</div>

</div>
</div>

<script src="js/admin.js"></script>

</body>
</html>
