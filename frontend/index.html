<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance System Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width: 380px;">
        <h3 class="text-center mb-3">Login</h3>

        <!-- Role Dropdown -->
        <select id="role" class="form-select mb-3" onchange="toggleFields()">
        <option value="admin">Admin / HOD / Faculty</option>
        <option value="student">Student</option>
        </select>

        <!-- Admin Fields -->
        <div id="adminFields">
            <input type="text" id="email" class="form-control mb-3" placeholder="Email">
            <input type="password" id="password" class="form-control mb-3" placeholder="Password">
        </div>

        <!-- Student Fields -->
        <div id="studentFields" style="display:none;">
            <input type="text" id="enrollment" class="form-control mb-3" placeholder="Enrollment ID">
            <input type="text" id="studentEmail" class="form-control mb-3" placeholder="Email">
            <input type="text" id="mobile" class="form-control mb-3" placeholder="Mobile Number">
            <input type="password" id="studentPassword" class="form-control mb-3" placeholder="Password">
        </div>

        <button class="btn btn-primary w-100" onclick="login()">Login</button>

        <p id="msg" class="text-danger mt-3 text-center"></p>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
