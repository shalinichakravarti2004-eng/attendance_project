<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            text-align:center;
        }

        .box{
            background:white;
            padding:20px;
            margin:100px auto;
            width:300px;
            border-radius:10px;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
        }

        button{
            padding:10px 20px;
            background:#6200ea;
            color:white;
            border:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Change Password</h2>

    <input type="password" id="oldPassword" placeholder="Old Password">
    <input type="password" id="newPassword" placeholder="New Password">

    <button onclick="changePassword()">Update Password</button>
</div>

<script src="js/change-password.js"></script>

</body>
</html>
